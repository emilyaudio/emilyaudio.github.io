<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>OG card</title>
        <style>
            /* Tokens copied from base.css (dark theme -- the site's base
               default, and the theme most embed surfaces sit in). */
            :root {
                --bg: #001021;
                --panel: #13293d;
                --text: #e9f2f6;
                --muted: #9db0ba;
                --vo: #1fb6e4;
                --post: #e0685c;
                --photo-bg: color-mix(in srgb, var(--text) 40%, var(--panel));
                --sans:
                    "Helvetica Neue", Helvetica, Arial, "Segoe UI", system-ui,
                    sans-serif;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                padding: 0;
            }
            /* Full-bleed two-tone split: copy left, portrait hard against the
               right, top and bottom edges. No inner frame -- inside a Discord
               embed the card is already a box in a box, and a third border made
               the portrait read as pasted on rather than part of the
               composition. The seam is a tone change ALONE, no rule: a border
               plus a tone change is two hard divides stacked. */
            .card {
                width: 1200px;
                height: 630px;
                overflow: hidden;
                display: grid;
                grid-template-columns: 1fr 468px;
                background-color: var(--bg);
                background-image: linear-gradient(
                    180deg,
                    var(--panel),
                    var(--bg) 900px
                );
                font-family: var(--sans);
                color: var(--text);
            }

            /* Three rows pin the copy to BOTH edges -- mark to the top margin,
               text block to the bottom -- instead of floating one centred stack
               with slack on every side. */
            .left {
                position: relative;
                isolation: isolate;
                display: grid;
                grid-template-rows: auto 1fr auto;
                padding: 66px 56px 60px 80px;
            }
            .mark {
                display: block;
                height: 70px;
                aspect-ratio: 810 / 303;
                background-color: var(--muted);
                -webkit-mask: url("../image/emily_audio_logo.png") left center /
                    contain no-repeat;
                mask: url("../image/emily_audio_logo.png") left center / contain
                    no-repeat;
            }
            .copy {
                grid-row: 3;
            }
            /* Kicker above the name mirrors the hub's own route cards (.kicker
               then h2), so the card reads in the same order as the page it
               links to. */
            .kicker {
                font-size: 27px;
                font-weight: 600;
                letter-spacing: -0.01em;
                margin: 0 0 16px;
            }
            .kicker .sep {
                color: var(--muted);
                font-weight: 400;
                padding: 0 9px;
            }
            .a-vo {
                color: var(--vo);
            }
            .a-post {
                color: var(--post);
            }
            h1 {
                font-size: 82px;
                line-height: 1;
                letter-spacing: -0.035em;
                font-weight: 700;
                margin: 0;
            }
            /* Sized for the SMALL render: Discord shows the card at 400-800px
               wide, so 33px lands at 11-22px. Line length is held near the
               site's ~70-character target by the column width. */
            .desc {
                font-size: 33px;
                line-height: 1.35;
                color: var(--muted);
                margin: 26px 0 0;
                text-wrap: balance;
            }

            /* The hub's own grounding device: a waveform band full-bleed to the
               bottom and left edges, sitting under the copy. Same path, same
               blend-both-accents treatment. Opacity is raised from the site's
               0.055 on purpose -- that value is tuned for a full-width page at
               1:1 and disappears once a 1200px card is scaled to 400px. */
            .band {
                position: absolute;
                z-index: -1;
                left: 0;
                right: 0;
                bottom: 0;
                height: 138px;
                color: color-mix(in srgb, var(--vo), var(--post));
                opacity: 0.14;
            }
            [data-v="vo"] .band {
                color: var(--vo);
            }
            [data-v="audio"] .band {
                color: var(--post);
            }
            .band svg {
                display: block;
                width: 100%;
                height: 100%;
            }

            /* Portrait panel. --photo-bg is the site's own figure treatment and
               it stays: base.css keeps the heavier 40% mix in dark precisely
               because the subject wears black, and a paler ground would cost
               the silhouette its edge. The figure is bottom-anchored and
               cropped by the card edge, so it stands ON the bottom rather than
               hovering above it. */
            .photo {
                position: relative;
                overflow: hidden;
                background: var(--photo-bg);
            }
            .photo img {
                position: absolute;
                bottom: 0;
                left: 50%;
                transform: translateX(-50%);
                /* Scaled so the figure's full height lands inside the 630px
                   card rather than being cropped by it -- at 100% of the panel
                   width the portrait is 766px tall and loses the top of her
                   head. */
                width: 78%;
                height: auto;
                display: block;
                /* Photo runs warm/saturated against the muted palette; mute it
                   a touch rather than casting a colour over it. */
                filter: saturate(0.85);
            }

            /* Per-variant: only one accent in the kicker on the surface cards. */
            [data-v="vo"] .only-hub,
            [data-v="audio"] .only-hub {
                display: none;
            }
            [data-v="hub"] .only-vo,
            [data-v="audio"] .only-vo,
            [data-v="hub"] .only-post,
            [data-v="vo"] .only-post {
                display: none;
            }
        </style>
    </head>
    <body>
        <section class="card">
            <div class="left">
                <span class="mark"></span>
                <div class="copy">
                    <p class="kicker">
                        <span class="a-vo only-hub">Voice-over</span
                        ><span class="sep only-hub">·</span
                        ><span class="a-post only-hub"
                            >Audio Post-Production</span
                        >
                        <span class="a-vo only-vo">Voice-over</span>
                        <span class="a-post only-post"
                            >Audio Post-Production</span
                        >
                    </p>
                    <h1>Emily Bryner</h1>
                    <p class="desc"></p>
                </div>

                </div>
            </div>
            <div class="photo">
                <img src="../image/em1_transparent.webp" alt="" />
            </div>
        </section>
        <script>
            // Variant comes from ?v=hub|vo|audio. Each description is its
            // surface's own meta description, condensed to a length that stays
            // readable once the card is scaled down.
            //
            // The compounds use U+2011 NON-BREAKING HYPHEN, not "-": in a
            // column this narrow the line breaks AT a plain hyphen, stranding
            // "broadcast-" and "e-" / "learning" across two lines. U+2011 is
            // visually identical and never a break opportunity. This is a
            // rendering fix local to the card -- the pages' own copy keeps
            // ordinary hyphens.
            var v = new URLSearchParams(location.search).get("v") || "hub";
            var desc = {
                hub: "Voice talent and audio engineer, equally at home in the booth and behind the board.",
                vo: "Warm, credible, broadcast‑ready reads for narration, e‑learning, animation, and games.",
                audio: "Sound design, mixing, and sweetening for broadcast, film, and video games.",
            };
            document.documentElement.setAttribute("data-v", v);
            document.querySelector(".desc").textContent = desc[v];
        </script>
    </body>
</html>
