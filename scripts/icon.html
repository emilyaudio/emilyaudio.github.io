<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>icon</title>
        <style>
            /* Wrapper for scripts/icons.sh. The mark lives in
               image/favicon.svg for the browser to use directly; this page
               exists only to rasterize it, and it carries its own inline copy
               of the geometry for two reasons:

               1. An <img> of favicon.svg would inherit that file's
                  prefers-color-scheme query. A .ico and an apple-touch-icon
                  each carry ONE fixed palette, so each needs a tone chosen by
                  hand. The two answers differ:

                  favicon.ico ships TRANSPARENT with a mid grey mark. An
                  extreme tone (off-white or off-black) does vanish against the
                  chrome that matches it, but a mid tone does not: #7c8386
                  measures at worst 2.91:1 against every real tab strip tested
                  (Chrome, Firefox and Safari, light and dark), and better than
                  3.6:1 against most. It is a compromise rather than a match
                  for either theme -- the SVG is what gives a crisp themed mark
                  -- but it is legible everywhere and carries no black box.

                  apple-touch-icon.png stays an OPAQUE tile, because iOS
                  composites a transparent touch icon onto black and applies
                  its own mask. Transparency is not an option there.
               2. Headless Chrome on macOS floors the layout viewport at ~485px
                  (see the `shot` target's note in the Makefile). A standalone
                  SVG document gets stretched to that floor and the screenshot
                  clips one magnified corner; a sized div that matches the
                  requested capture box does not.

               Keep the four rects in step with image/favicon.svg by hand. */
            html,
            body {
                margin: 0;
                padding: 0;
            }
            .plate {
                display: grid;
                place-items: center;
            }
            /* ?v=ico -- downscaled to 32 + 16. No plate colour: icons.sh renders
               this variant on a transparent backdrop. The mark is inset less
               than the touch icon's: at 16px there is no room for margin. */
            [data-v="ico"] .plate {
                width: 32px;
                height: 32px;
            }
            [data-v="ico"] svg {
                width: 32px;
                height: 32px;
            }
            [data-v="ico"] .bar {
                fill: #7c8386;
            }
            /* ?v=touch -- iOS applies its own rounded mask and never honours
               transparency, so this one keeps the navy plate and the mark sits
               well inside it. */
            [data-v="touch"] .plate {
                width: 180px;
                height: 180px;
                background: #001021;
            }
            [data-v="touch"] svg {
                width: 108px;
                height: 108px;
            }
            [data-v="touch"] .bar {
                fill: #e9f2f6;
            }
            svg {
                display: block;
            }
        </style>
    </head>
    <body>
        <div class="plate">
            <svg viewBox="0 0 32 32" aria-hidden="true">
                <rect
                    class="bar"
                    x="3.5"
                    y="9.5"
                    width="4"
                    height="13"
                    rx="2"
                />
                <rect
                    class="bar"
                    x="10.5"
                    y="3"
                    width="4"
                    height="26"
                    rx="2"
                />
                <rect
                    class="bar"
                    x="17.5"
                    y="6.5"
                    width="4"
                    height="19"
                    rx="2"
                />
                <rect
                    class="bar"
                    x="24.5"
                    y="10.5"
                    width="4"
                    height="11"
                    rx="2"
                />
            </svg>
        </div>
        <script>
            document.documentElement.setAttribute(
                "data-v",
                new URLSearchParams(location.search).get("v") || "touch",
            );
        </script>
    </body>
</html>
