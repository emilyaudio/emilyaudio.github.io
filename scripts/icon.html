<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>icon</title>
        <style>
            /* Wrapper for scripts/icons.sh. The mark lives in
               image/favicon.svg for the browser to use directly; this page
               exists only to rasterize it, and it carries its own inline copy
               of the geometry for two reasons:

               1. An <img> of favicon.svg would inherit that file's
                  prefers-color-scheme query. A .ico and an apple-touch-icon
                  each carry ONE fixed palette, and a one-colour mark cannot
                  pick a tone that works transparently on both light and dark
                  chrome -- whichever it picks, it vanishes against the matching
                  one. So both rasters ship as an opaque tile: the off-white
                  mark on the site's --bg navy, legible on any chrome.
               2. Headless Chrome on macOS floors the layout viewport at ~485px
                  (see the `shot` target's note in the Makefile). A standalone
                  SVG document gets stretched to that floor and the screenshot
                  clips one magnified corner; a sized div that matches the
                  requested capture box does not.

               Keep the four rects in step with image/favicon.svg by hand. */
            html,
            body {
                margin: 0;
                padding: 0;
            }
            .plate {
                display: grid;
                place-items: center;
                background: #001021;
            }
            /* ?v=ico -- downscaled to 32 + 16. The mark is inset less than the
               touch icon's: at 16px there is no room to spend on margin. */
            [data-v="ico"] .plate {
                width: 32px;
                height: 32px;
            }
            [data-v="ico"] svg {
                width: 32px;
                height: 32px;
            }
            /* ?v=touch -- iOS applies its own rounded mask and never honours
               transparency, so the mark sits well inside the tile. */
            [data-v="touch"] .plate {
                width: 180px;
                height: 180px;
            }
            [data-v="touch"] svg {
                width: 108px;
                height: 108px;
            }
            svg {
                display: block;
            }
            .bar {
                fill: #e9f2f6;
            }
        </style>
    </head>
    <body>
        <div class="plate">
            <svg viewBox="0 0 32 32" aria-hidden="true">
                <rect
                    class="bar"
                    x="3.5"
                    y="9.5"
                    width="4"
                    height="13"
                    rx="2"
                />
                <rect
                    class="bar"
                    x="10.5"
                    y="3"
                    width="4"
                    height="26"
                    rx="2"
                />
                <rect
                    class="bar"
                    x="17.5"
                    y="6.5"
                    width="4"
                    height="19"
                    rx="2"
                />
                <rect
                    class="bar"
                    x="24.5"
                    y="10.5"
                    width="4"
                    height="11"
                    rx="2"
                />
            </svg>
        </div>
        <script>
            document.documentElement.setAttribute(
                "data-v",
                new URLSearchParams(location.search).get("v") || "touch",
            );
        </script>
    </body>
</html>
